# Alembic-CLI für die Entwicklung, z. B. neue Revision erzeugen:
#   alembic revision --autogenerate -m "kurze beschreibung"
# Die Datenbank-URL kommt aus DATABASE_URL (backend/database.py), nicht aus dieser Datei.
# Im Betrieb wird ausschließlich `python -m backend.migrate` aufgerufen.

[alembic]
script_location = %(here)s/backend/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
